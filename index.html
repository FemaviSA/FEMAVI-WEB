<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0067ac" />

    <!-- Defaults para la home y para el instante previo a que monte React.
         OJO: React 19 hoistea sus propios <title>/<meta>/<link> APENDEÁNDOLOS al head,
         no reemplazando estos. Eso dejaba dos canonical y dos description por página, y
         el primero (el de acá) ganaba: cada ficha de producto declaraba canonical = home,
         que le dice a Google "indexá la home en lugar de esta página".
         Por eso van marcados con data-default: el componente SEO los elimina al montar. -->
    <title>FEMAVI — Productos Químicos Industriales en Argentina | +50 años fabricando</title>
    <meta data-default name="description" content="Fabricantes argentinos de productos químicos industriales: desengrasantes, bactericidas, ceras, lubricantes, anticorrosivos. Fórmulas de desarrollo propio, entrega en 48 hs. +20.000 clientes." />
    <meta name="keywords" content="productos químicos industriales argentina, desengrasante industrial, bactericida industrial, cera acrílica, limpieza industrial, productos para flotas, productos para gastronomía, fabricante argentino, FEMAVI, Liniers" />
    <meta name="author" content="FEMAVI S.A." />

    <!-- Verificación de propiedad en Google Search Console (propiedad https://www.femavi.com.ar/).
         No otorga ningún permiso sobre el sitio: solo prueba que somos los dueños.
         No borrar — si se elimina, Google revoca la verificación y se pierde el acceso
         a los informes de rendimiento y a la solicitud de indexación. -->
    <meta name="google-site-verification" content="zEaH0x8ctmS9-tS5yOF-Fw5d3uAZejfeWDkn_xdZ7pg" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- Geo / Local (no cambian por ruta) -->
    <meta name="geo.region" content="AR-C" />
    <meta name="geo.placename" content="Liniers, CABA, Argentina" />
    <meta name="ICBM" content="-34.6396, -58.5237" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Performance: preconnect critical origins -->
    <link rel="preconnect" href="https://lhqawwjszwjzxxsonvwa.supabase.co" />
    <link rel="dns-prefetch" href="https://lhqawwjszwjzxxsonvwa.supabase.co" />
    <link rel="preconnect" href="https://www.femavi.com.ar" />
    <link data-default rel="canonical" href="https://www.femavi.com.ar/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />

    <!-- Analytics: ya no va acá. El snippet que había estaba comentado y con un ID de
         ejemplo en vez del real, o sea que no medía nada. Ahora lo maneja
         src/lib/analytics.ts, que además de las visitas mide los eventos que importan
         (clicks a WhatsApp y cotizaciones enviadas).
         Para activarlo: definir VITE_GA4_ID en las variables de entorno de Vercel. -->

    <!-- Structured Data global: Organization + LocalBusiness + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.femavi.com.ar/#organization",
          "name": "FEMAVI S.A.",
          "alternateName": "FEMAVI",
          "url": "https://www.femavi.com.ar/",
          "logo": "https://www.femavi.com.ar/favicon.svg",
          "foundingDate": "1970",
          "description": "Fabricantes argentinos de productos químicos industriales con más de 50 años de desarrollo propio.",
          "sameAs": ["https://www.linkedin.com/company/femavi-sa"],
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+54-9-116228-4649",
            "contactType": "sales",
            "areaServed": "AR",
            "availableLanguage": ["Spanish"]
          }
        },
        {
          "@type": "LocalBusiness",
          "@id": "https://www.femavi.com.ar/#localbusiness",
          "name": "FEMAVI S.A.",
          "image": "https://www.femavi.com.ar/favicon.svg",
          "url": "https://www.femavi.com.ar/",
          "telephone": "+54-9-116228-4649",
          "email": "ventas@femavi.com.ar",
          "priceRange": "$$",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Ibarrola 7071",
            "addressLocality": "Liniers",
            "addressRegion": "CABA",
            "postalCode": "C1408",
            "addressCountry": "AR"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": -34.6396,
            "longitude": -58.5237
          },
          "openingHoursSpecification": {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
            "opens": "08:00",
            "closes": "17:00"
          },
          "areaServed": [
            { "@type": "Country", "name": "Argentina" },
            { "@type": "AdministrativeArea", "name": "AMBA" }
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.femavi.com.ar/#website",
          "url": "https://www.femavi.com.ar/",
          "name": "FEMAVI",
          "publisher": { "@id": "https://www.femavi.com.ar/#organization" },
          "inLanguage": "es-AR"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="text-align:center;padding:40px;font-family:sans-serif">
        FEMAVI — Productos químicos industriales con más de 50 años. Por favor activá JavaScript para ver el catálogo, o llamanos al +54 9 116228-4649.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
